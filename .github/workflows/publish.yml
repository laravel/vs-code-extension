name: Publish VS Code Extension with Changelog Update

on:
    release:
        types: [created]

permissions:
  contents: read

jobs:
    update_changelog:
        if: ${{ !github.event.release.prerelease }}
        uses: laravel/.github/.github/workflows/update-changelog.yml@9c15e86fffce728fb6c50ebeae24fd63e98f4d1d # main
        permissions:
            contents: write

    publish:
        runs-on: ubuntu-latest
        needs: update_changelog
        if: ${{ !github.event.release.prerelease }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm install

            - name: Publish Extension
              env:
                  VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
              run: npx vsce publish -p $VSCE_TOKEN --no-git-tag-version

    publish_prerelease:
        runs-on: ubuntu-latest
        if: ${{ github.event.release.prerelease }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm install

            - name: Publish Pre-Release Extension
              env:
                  VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
              run: npx vsce publish --pre-release -p $VSCE_TOKEN --no-git-tag-version
